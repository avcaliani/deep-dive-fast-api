services:

  mongo:
    image: mongo:9.0
    restart: always
    environment:
      MONGO_INITDB_DATABASE: dunderMifflinDB
    ports:
      - "27017:27017"
    volumes:
      - ./resources/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js

  api:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      - APP_ENV=docker
      - DYNACONF_MONGODB_CONFIG__host=mongo
      - DYNACONF_TOKEN_SECRET_KEY
    ports:
      - "8000:8000"
